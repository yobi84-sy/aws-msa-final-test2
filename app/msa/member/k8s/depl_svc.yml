apiVersion: apps/v1
kind: Deployment
metadata:
  name: member-depl
  namespace: soldesk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: member
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
      labels:
        app: member
    spec:
      # 복제 수가 증가하면 노드별 파드 수가 고르게 배치되도록 유도
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: member
      containers:
      - name: member-container
        image: 143710973003.dkr.ecr.ap-northeast-2.amazonaws.com/member-service:lab-v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
        # 컨테이너가 사용할수 있는 리소스의 최대치
          limits:
            cpu: "1"
            memory: "500Mi"
        # 컨테이너가 시작될떄 보장받아야 하는 최소 자원
          requests:
            cpu: "0.5"
            memory: "250Mi"
        env:
        # 회원 서비스와 Gateway가 같은 JWT 서명 키 사용
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: my-app-secrets
              key: JWT_SECRET
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: my-app-secrets
              key: JWT_REFRESH_SECRET
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: my-app-secrets
              key: DB_HOST
        - name: DB_PW
          valueFrom:
            secretKeyRef:
              name: my-app-secrets
              key: DB_PW
        # 컨테이너 상태 확인 
        # Java 애플리케이션 시작을 약 3분까지 기다림
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 18

        # 응답 가능한 Pod에만 Service 트래픽 전달
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3

        # 시작 완료 후 응답 실패가 반복되면 컨테이너 재시작
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: member-service
  namespace: soldesk
  labels:
    # 모니터링 차트의 ServiceMonitor가 선택하는 라벨
    monitoring: final-apps
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8080
  selector:
    app: member
  