apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-credential-sync
  namespace: soldesk
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: db-credential-sync
  namespace: soldesk
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [db-credentials]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [member-depl, product-depl, ordering-depl]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: db-credential-sync
  namespace: soldesk
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: db-credential-sync
subjects:
  - kind: ServiceAccount
    name: db-credential-sync
    namespace: soldesk
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-credential-sync
  namespace: soldesk
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: db-credential-sync
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
              command: [python, -u, -B, /scripts/db_credential_sync.py]
              env:
                - name: NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              resources:
                requests:
                  cpu: 10m
                  memory: 24Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: db-credential-sync-script
