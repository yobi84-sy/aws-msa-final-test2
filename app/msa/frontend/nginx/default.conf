server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 관리자 HTML은 JWT 확인을 통과한 요청에만 제공한다.
    location ~* ^/(admin|product-create)\.html$ {
        auth_request /_admin_auth;
        add_header Cache-Control "no-store" always;
        error_page 401 = /login.html;
        error_page 403 = /forbidden.html;
    }

    # 외부에서는 호출할 수 없는 인증 전용 하위 요청
    location = /_admin_auth {
        internal;
        proxy_pass http://apigateway-service/member-service/member/admin-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
