spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  config:
    activate:
      on-profile: prod
  application:
    name: product-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:3306/ordermsa?sslMode=VERIFY_IDENTITY
    username: admin
    password: ${DB_PW}
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
    generate-ddl: true
    hibernate:
      ddl-auto: update
    show_sql: true

cloud:
  aws:
    # 액세스 키 설정 없이 IAM 역할로 인증
    region:
      static: ap-northeast-2
    s3:
      # Kubernetes에서 전달하는 상품 이미지 버킷 이름
      bucket: ${S3_BUCKET_NAME}

# Prometheus가 HTTP 지표를 수집할 수 있도록 Actuator 엔드포인트 공개
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
