# AWS Load Balancer Controller Helm 차트 3.6.0용 설정
# vpcId는 AWS 생성 후 terraform output -raw vpc_id 값으로 설치 명령에 전달
clusterName: Final-eks
region: ap-northeast-2
replicaCount: 1
serviceAccount:
  create: true
  name: aws-load-balancer-controller
  annotations:
    # Terraform의 IAM 신뢰 정책과 동일한 계정 이름
    eks.amazonaws.com/role-arn: arn:aws:iam::021158485482:role/Final-load-balancer-controller-role
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

