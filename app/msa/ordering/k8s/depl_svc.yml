apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordering-depl
  namespace: soldesk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ordering 
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
      labels:
        app: ordering 
    spec:
      # 복제 수가 증가하면 노드별 파드 수가 고르게 배치되도록 유도
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ordering
      # 주문 이벤트 SNS 전용 IAM 역할 사용
      serviceAccountName: ordering-service-account
      containers:
      - name: ordering-container
        image: 143710973003.dkr.ecr.ap-northeast-2.amazonaws.com/ordering-service:lab-v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
        # 컨테이너가 사용할수 있는 리소스의 최대치
          limits:
            cpu: "1"
            memory: "500Mi"
        # 컨테이너가 시작될떄 보장받아야 하는 최소 자원
          requests:
            cpu: "0.5"
            memory: "250Mi"
        env:
        # 기존 운영 SNS의 구독 이메일로만 주문 알림 발송
        - name: ORDER_NOTIFICATIONS_ENABLED
          value: "true"
        - name: ORDER_NOTIFICATION_TOPIC_ARN
          value: arn:aws:sns:ap-northeast-2:143710973003:Final-operations-alerts
        - name: AWS_REGION
          value: ap-northeast-2
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: my-app-secrets
              key: DB_HOST
        - name: DB_PW
          valueFrom:
            secretKeyRef:
              name: my-app-secrets
              key: DB_PW
        # 컨테이너 상태 확인 
        # Java 애플리케이션 시작을 약 3분까지 기다림
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 18

        # 응답 가능한 Pod에만 Service 트래픽 전달
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3

        # 시작 완료 후 응답 실패가 반복되면 컨테이너 재시작
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3

--- 
apiVersion: v1
kind: Service
metadata:
  name: ordering-service
  namespace: soldesk
  labels:
    # 모니터링 차트의 ServiceMonitor가 선택하는 라벨
    monitoring: final-apps
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8080
  selector:
    app: ordering