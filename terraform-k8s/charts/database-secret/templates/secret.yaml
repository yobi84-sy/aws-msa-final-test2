apiVersion: v1
kind: ServiceAccount
metadata:
  name: database-secret-reader
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.roleArn | quote }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: database-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: database-secret-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-credentials
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: database-secrets
    kind: SecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: DB_PW
      remoteRef:
        key: {{ .Values.secretArn | quote }}
        property: password
